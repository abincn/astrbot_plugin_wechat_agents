name: Build plugin package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check view JavaScript syntax
        run: node --check views/tasks/app.js
      - name: Build install ZIP
        run: python tools/package_plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: astrbot_plugin_wechat_agents
          path: dist/astrbot_plugin_wechat_agents.zip
          if-no-files-found: error
